<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vault</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #0a0a0a;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 16px;
        padding: 32px;
      }
      .mono {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: #171717;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: -1px;
      }
      h1 { font-size: 18px; font-weight: 600; }
      p { color: #a3a3a3; font-size: 14px; max-width: 320px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="mono">V</div>
    <h1>You're offline</h1>
    <p>Vault works from your saved copy. Reconnect to sync new changes.</p>
  </body>
</html>
